ShortDescription: "Amounts in words (tafqit) for cheques and invoices, in Arabic, English and French."
Description: |-
  InstaWords (تفقيط) is a native Windows app that writes amounts in words for cheques, invoices and receipts, in Arabic, English and French, with 100+ currencies and units (halalas, fils, cents...).
  Live conversion as you type, Arabic-Indic or Western digits, مائة/مئة, prefix and suffix presets ("فقط ... لا غير", "... Only").
  Bulk tab: paste a whole column from Excel or import CSV, then copy the results or export UTF-8 CSV.
  Ctrl+Alt+T from any program turns the number on the clipboard into words, ready to paste.
  Tray icon, optional start with Windows, in-app updates verified by SHA-256. Works fully offline; nothing about your numbers is ever sent.
  WPF on .NET Framework 4.8, which ships with Windows 10 and 11: nothing else to install, no admin rights. Free and open source (MIT).
