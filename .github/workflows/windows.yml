name: Windows (native app)

# InstaWords for Windows: a native WPF app on .NET Framework 4.8 (built into Windows 10/11).
# Every push: engine parity tests, app unit tests, the app itself, UI tests with screenshots,
# the Inno Setup installer and a portable zip, uploaded as workflow artifacts.
# A manual run with "release" ticked also publishes GitHub Release v<package.json version>.
# The asset names below are what the app's updater looks for: keep them.
# Code signing (optional, docs/CODE-SIGNING.md): release runs from the default branch sign InstaWords.exe,
# InstaWords.Core.dll and the setup through SignPath when the SIGNPATH_ORGANIZATION_ID variable is set;
# otherwise they skip cleanly. The SIGNPATH_API_TOKEN secret lives in the protected `signing` environment,
# which only those runs enter, and only the two SignPath steps receive it (never npm ci, builds or tests).
# The release also gets SHA256SUMS.txt, winget-manifests.zip and instawords.json (docs/PACKAGING.md),
# and the Excel add-in InstaWords.xlam (scripts/build-xlam.mjs, from vba/Tafqit.bas).

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish GitHub Release v<package.json version> from this commit"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    # Release runs from the default branch enter the `signing` environment (its deployment-branch rule
    # and optional reviewers guard SIGNPATH_API_TOKEN); every other run uses no environment at all.
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.SIGNPATH_ORGANIZATION_ID != '') && 'signing' || '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signed.outputs.signed }}
    env:
      # The switch is the (non-secret) SIGNPATH_ORGANIZATION_ID variable: unset → every signing step is skipped.
      # The token itself is NOT in the job env; only the SignPath steps get it through `with: api-token`.
      SIGNING_CONFIGURED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      # Only release runs from the default branch are signed (each SignPath request may need a manual approval).
      SIGN_THIS_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.release && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          numeric=${version%%-*}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "InstaWords $version"

      - run: npm ci

      # npm run build, then build-dotnet.mjs --check (generated C# up to date),
      # gen-dotnet-corpus.mjs, and the engine's parity tests (dotnet test windows/InstaWords.Core.Tests).
      - name: Engine parity tests
        run: npm run test:dotnet

      - name: Generated files are committed and current
        shell: bash
        run: |
          node scripts/build-dotnet.mjs
          git diff --exit-code

      # Excel add-in: built from the committed vba/Tafqit.bas (CI checks it is current) and read
      # back by its tests before it is shipped.
      - name: Excel add-in (InstaWords.xlam)
        shell: bash
        run: |
          node --test tests/vba/xlam.test.mjs
          node scripts/build-xlam.mjs --out out/InstaWords.xlam

      - name: App unit tests (updater, problem reports, CSV)
        run: dotnet test windows/InstaWords.App.Tests -c Release

      - name: Build the app
        run: dotnet build windows/InstaWords.App -c Release -p:Version=${{ steps.version.outputs.version }}

      # Larger desktop for readable screenshots (the default runner screen is small). Best effort.
      - name: Screen resolution
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: UI tests
        env:
          INSTAWORDS_APP_PATH: ${{ github.workspace }}\windows\InstaWords.App\bin\Release\net48\InstaWords.exe
          INSTAWORDS_ARTIFACTS: ${{ github.workspace }}\out\screenshots
        run: dotnet test windows/InstaWords.UITests -c Release --logger "console;verbosity=normal" --logger "trx;LogFileName=ui-tests.trx" --results-directory out/test-results

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: InstaWords-${{ steps.version.outputs.version }}-screenshots
          path: |
            out/screenshots/*.png
            out/test-results/*.trx
          if-no-files-found: warn

      # ---- Code signing, part 1: the app (SignPath; skipped unless SIGNPATH_ORGANIZATION_ID is set) ----
      - name: Upload the unsigned app for signing
        id: unsigned-app
        if: env.SIGNING_CONFIGURED == 'true' && env.SIGN_THIS_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: InstaWords-${{ steps.version.outputs.version }}-unsigned-app
          path: |
            windows/InstaWords.App/bin/Release/net48/InstaWords.exe
            windows/InstaWords.App/bin/Release/net48/InstaWords.Core.dll
          if-no-files-found: error
          retention-days: 1

      # Replaces InstaWords.exe and InstaWords.Core.dll in bin/ with the signed files, so the
      # installer and the portable zip below are built from them.
      - name: Sign the app (SignPath)
        if: env.SIGNING_CONFIGURED == 'true' && env.SIGN_THIS_RUN == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tafket' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG || 'app' }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: windows/InstaWords.App/bin/Release/net48

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Qp `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DNumericVersion=${{ steps.version.outputs.numeric }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\windows\InstaWords.App\bin\Release\net48" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\out" `
            windows\installer\InstaWords.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---- Code signing, part 2: the installer ----
      - name: Upload the unsigned installer for signing
        id: unsigned-setup
        if: env.SIGNING_CONFIGURED == 'true' && env.SIGN_THIS_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: InstaWords-${{ steps.version.outputs.version }}-unsigned-setup
          path: out/InstaWords_${{ steps.version.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer (SignPath)
        if: env.SIGNING_CONFIGURED == 'true' && env.SIGN_THIS_RUN == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tafket' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG || 'setup' }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: out

      - name: Verify signatures
        id: signed
        shell: pwsh
        run: |
          $files = @(
            "windows\InstaWords.App\bin\Release\net48\InstaWords.exe",
            "windows\InstaWords.App\bin\Release\net48\InstaWords.Core.dll",
            "out\InstaWords_${{ steps.version.outputs.version }}_x64-setup.exe"
          )
          $expectSigned = ($env:SIGNING_CONFIGURED -eq 'true') -and ($env:SIGN_THIS_RUN -eq 'true')
          $valid = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            "{0}: {1} {2}" -f $f, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -eq 'Valid') { $valid++ }
          }
          if ($expectSigned -and $valid -ne $files.Count) { throw "Signing was requested but not every file has a valid signature." }
          if (-not $expectSigned) { "Not signed: SIGNPATH_ORGANIZATION_ID not set, or not a release run from the default branch (docs/CODE-SIGNING.md)." }
          "signed=$($expectSigned.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $src = "windows\InstaWords.App\bin\Release\net48"
          $stage = "out\portable\InstaWords"
          New-Item -ItemType Directory -Force -Path "$stage\Licenses" | Out-Null
          Copy-Item "$src\InstaWords.exe", "$src\InstaWords.exe.config", "$src\InstaWords.Core.dll" $stage
          Copy-Item "$src\Licenses\*" "$stage\Licenses"
          # Marks the copy as portable: updates open the release page instead of running the installer.
          @"
          InstaWords $v (portable)

          تشغيل: InstaWords.exe. لا يحتاج تثبيتاً. الإعدادات في %APPDATA%\FastKiwi\InstaWords
          Run InstaWords.exe. No install needed. Settings are kept in %APPDATA%\FastKiwi\InstaWords
          https://fastkiwi.app/instawords/
          "@ | Set-Content -Encoding utf8 "$stage\portable.txt"
          Compress-Archive -Path "$stage" -DestinationPath "out\InstaWords_${v}_x64-portable.zip" -Force
          Get-ChildItem out -File | Format-Table Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: InstaWords-${{ steps.version.outputs.version }}-windows
          path: |
            out/InstaWords_*_x64-setup.exe
            out/InstaWords_*_x64-portable.zip
            out/InstaWords.xlam
          if-no-files-found: error

  # Publishes the UI-test screenshots to the ci-screenshots branch so they can be reviewed
  # without downloading artifacts (e.g. from the cloud build environment). Never touches other branches.
  screenshots:
    # Only the default branch publishes ci-screenshots (other branches and Dependabot runs
    # would overwrite it), one run at a time so concurrent force-pushes don't race.
    if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: ci-screenshots
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: InstaWords-*-screenshots
          merge-multiple: true
          path: shots
      - name: Push to ci-screenshots
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d shots ] || [ -z "$(ls -A shots 2>/dev/null)" ]; then echo "No screenshots."; exit 0; fi
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Screenshots for ${GITHUB_SHA} (${GITHUB_REF_NAME}), run ${GITHUB_RUN_ID}" > README.md
          git add -A
          git commit -q -m "UI screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The packaging templates and scripts/package-manifests.mjs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: InstaWords-${{ needs.build.outputs.version }}-windows
          path: out

      # sha256sum format; Scoop's autoupdate reads it ("hash": {"url": "$baseurl/SHA256SUMS.txt"}).
      - name: SHA256SUMS.txt
        working-directory: out
        run: |
          sha256sum "InstaWords_${VERSION}_x64-setup.exe" "InstaWords_${VERSION}_x64-portable.zip" InstaWords.xlam > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # This version's notes from CHANGELOG.md (the job fails if the section is missing).
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          {
            echo 'notes<<CHANGELOG_EOF'
            node scripts/changelog-section.mjs "$VERSION"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: InstaWords v${{ needs.build.outputs.version }}
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: |
            out/InstaWords_${{ needs.build.outputs.version }}_x64-setup.exe
            out/InstaWords_${{ needs.build.outputs.version }}_x64-portable.zip
            out/InstaWords.xlam
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            ## InstaWords — تفقيط v${{ needs.build.outputs.version }}

            ### الجديد في هذا الإصدار · What's new

            ${{ steps.notes.outputs.notes }}

            <div dir="rtl">

            **العربية**

            برنامج Windows **أصلي** لكتابة المبالغ بالحروف للشيكات والفواتير، بالعربية والإنجليزية والفرنسية، بأكثر من 100 عملة ووحدة. ليس موقعاً داخل نافذة: واجهة Windows حقيقية، سريعة وخفيفة، تعمل كلها **دون إنترنت**، ولا تحتاج تثبيت أي شيء إضافي على Windows 10 و11.

            - **`InstaWords_${{ needs.build.outputs.version }}_x64-setup.exe`**: المثبّت (موصى به). يثبّت للمستخدم الحالي دون صلاحيات المسؤول، ويحدّث نفسه من داخل البرنامج.
            - **`InstaWords_${{ needs.build.outputs.version }}_x64-portable.zip`**: نسخة محمولة: فكّ الضغط وشغّل `InstaWords.exe`.
            - **Ctrl+Alt+T** من أي برنامج: انسخ رقماً، اضغط الاختصار، فيصبح ما في الحافظة المبلغَ مكتوباً بالحروف جاهزاً للصق.
            - تبويب «دفعة» لتحويل عمود كامل من Excel، مع تصدير CSV.
            - **`InstaWords.xlam`**: إضافة Excel تضيف الدالة `=TAFQIT(A1, "SAR")` إلى كل مصنف دون إنترنت. قبل تثبيتها: زر الفأرة الأيمن ← خصائص ← «إلغاء الحظر»، ثم في Excel: ملف ← خيارات ← الوظائف الإضافية ← انتقال ← استعراض. (مبنية وفق المواصفات ومختبرة آلياً، ولم تُجرَّب بعد في Excel حقيقي.) التفاصيل في `vba/README.md`.
            - ${{ needs.build.outputs.signed == 'true' && 'البرنامج والمثبّت موقّعان رقمياً.' || 'البرنامج غير موقّع رقمياً بعد، لذا قد يظهر تحذير SmartScreen: اختر «مزيد من المعلومات» ثم «تشغيل على أي حال».' }}
            - بصمات SHA-256 في `SHA256SUMS.txt`.

            </div>

            **English**

            A **native** Windows app that writes amounts in words for cheques and invoices, in Arabic, English and French, with 100+ currencies and units. Not a website in a window: a real Windows UI, fast and light, that works fully **offline** and needs nothing extra on Windows 10 and 11.

            - **`InstaWords_${{ needs.build.outputs.version }}_x64-setup.exe`**: installer (recommended). Per-user, no admin rights; updates itself from inside the app.
            - **`InstaWords_${{ needs.build.outputs.version }}_x64-portable.zip`**: portable: unzip and run `InstaWords.exe`.
            - **Ctrl+Alt+T** from any program: copy a number, press the shortcut, and the clipboard now holds the amount in words, ready to paste.
            - Bulk tab to convert a whole Excel column, with CSV export.
            - **`InstaWords.xlam`**: Excel add-in adding `=TAFQIT(A1, "SAR")` to every workbook, offline. Before installing: right-click → Properties → Unblock; then Excel → File → Options → Add-ins → Go → Browse. (Built to spec and verified by parsing; not yet smoke-tested in a real Excel.) See `vba/README.md`.
            - ${{ needs.build.outputs.signed == 'true' && 'The app and the installer are code-signed.' || 'The app is not code-signed yet, so SmartScreen may warn: click "More info" → "Run anyway".' }}
            - SHA-256 checksums: `SHA256SUMS.txt`. winget and Scoop manifests for this version: `winget-manifests.zip`, `instawords.json` (docs/PACKAGING.md).

      # winget + Scoop manifests filled with this release's real SHA-256, attached to the release.
      # A failure here leaves the release itself in place; rerun the job or run the script locally.
      - name: Package manager manifests (winget-manifests.zip, instawords.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/package-manifests.mjs \
            --setup "out/InstaWords_${VERSION}_x64-setup.exe" \
            --portable "out/InstaWords_${VERSION}_x64-portable.zip" \
            --version "${VERSION}" --date "$(date -u +%F)" --out out/packages
          # The hashes in the manifests must be the digests GitHub recorded for the uploaded assets.
          for f in "InstaWords_${VERSION}_x64-setup.exe" "InstaWords_${VERSION}_x64-portable.zip"; do
            digest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" --jq ".assets[] | select(.name == \"$f\") | .digest")
            built="sha256:$(sha256sum "out/$f" | cut -d' ' -f1)"
            echo "$f  github=${digest:-none}  built=$built"
            if [ -n "$digest" ] && [ "$digest" != "$built" ]; then echo "::error::$f: GitHub digest differs from the built file"; exit 1; fi
          done
          (cd out/packages/winget-manifests && zip -qr ../../winget-manifests.zip manifests)
          cp out/packages/instawords.json out/instawords.json
          unzip -l out/winget-manifests.zip
          gh release upload "v${VERSION}" out/winget-manifests.zip out/instawords.json --repo "${GITHUB_REPOSITORY}" --clobber
