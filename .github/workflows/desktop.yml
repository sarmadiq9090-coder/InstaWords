name: Desktop (Windows)

# Builds the InstaWords Windows app (Tauri v2) from the same offline site as the website.
# Every push: installer + portable exe as a workflow artifact.
# Tags v*, or a manual run with "release" ticked: also a GitHub Release (tag v<package.json version>)
# with both files attached.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release v<package.json version> from this commit"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      # Runs `npm run build:site` (beforeBuildCommand), then cargo build + NSIS bundle.
      - run: npm run desktop:build

      - name: Collect installer and portable exe
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          rel=desktop/src-tauri/target/release
          mkdir -p out
          cp "$rel"/bundle/nsis/*-setup.exe out/
          cp "$rel/InstaWords.exe" "out/InstaWords_${v}_x64-portable.exe"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: InstaWords-${{ steps.version.outputs.version }}-windows-x64
          path: out/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InstaWords-${{ needs.build.outputs.version }}-windows-x64
          path: out

      - uses: softprops/action-gh-release@v2
        env:
          TAG: v${{ needs.build.outputs.version }}
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: InstaWords v${{ needs.build.outputs.version }}
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: out/*.exe
          fail_on_unmatched_files: true
          body: |
            ## InstaWords — تفقيط v${{ needs.build.outputs.version }}

            **العربية**

            تطبيق Windows لكتابة المبالغ بالحروف للشيكات والفواتير، بالعربية ولغات أخرى. يعمل دون إنترنت، ونتائجه مطابقة للموقع.

            - **`InstaWords_…_x64-setup.exe`**: المثبّت (موصى به). يثبّت للمستخدم الحالي دون صلاحيات المسؤول.
            - **`InstaWords_…_x64-portable.exe`**: نسخة محمولة تعمل دون تثبيت (تتطلب WebView2، وهو مثبّت مسبقاً في Windows 11 ومعظم أجهزة Windows 10).
            - التطبيق غير موقّع رقمياً بعد، لذا قد يظهر تحذير SmartScreen: اختر «مزيد من المعلومات» ثم «تشغيل على أي حال».

            **English**

            Windows app that writes amounts in words for cheques and invoices, in Arabic and other languages. Works fully offline; output is identical to the website.

            - **`InstaWords_…_x64-setup.exe`**: installer (recommended). Per-user install, no admin rights needed.
            - **`InstaWords_…_x64-portable.exe`**: portable exe, no install (needs WebView2, preinstalled on Windows 11 and most Windows 10 PCs).
            - The app is not code-signed yet, so SmartScreen may warn: click "More info" → "Run anyway".
