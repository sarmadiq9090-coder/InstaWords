name: CI

# Every push and pull request: the TypeScript core, the Excel VBA module and add-in, the website (Playwright)
# and the .NET engine's parity tests (Linux is enough: InstaWords.Core is netstandard2.0, its tests net10.0).
# The Windows app itself, its UI tests and the installer are built by windows.yml.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # oletools (olevba) reads InstaWords.xlam as an independent check in tests/vba/xlam.test.mjs.
      - name: Install oletools for the Excel add-in check
        run: |
          python3 -m venv "$RUNNER_TEMP/oletools"
          "$RUNNER_TEMP/oletools/bin/pip" install --quiet oletools==0.60.2
      # Includes the Excel add-in: scripts/build-xlam.mjs is read back stream by stream and compared
      # with vba/Tafqit.bas, by the Node readers and by olevba.
      - run: npm run test:vba
        env:
          OLETOOLS_PYTHON: ${{ runner.temp }}/oletools/bin/python
      - name: Excel add-in builds (InstaWords.xlam)
        run: node scripts/build-xlam.mjs --out out/InstaWords.xlam
      - name: Check generated VBA is up to date
        run: git diff --exit-code -- vba/Tafqit.bas vba/TafqitTests.bas
      # npm run build, build-dotnet.mjs --check (generated C# current), the corpus, dotnet test InstaWords.Core.Tests.
      - name: .NET engine parity tests
        run: npm run test:dotnet
      # The committed winget/Scoop copies follow site/release-fallback.json (warning only: the
      # site sync may refresh the JSON alone; `npm run release:fallback` updates both).
      - name: Package manifests follow site/release-fallback.json
        run: |
          node scripts/package-manifests.mjs
          if ! git diff --quiet -- packaging/ || [ -n "$(git status --porcelain -- packaging/)" ]; then
            echo "::warning::packaging/ is behind site/release-fallback.json: run 'node scripts/package-manifests.mjs' and commit."
            git status --short -- packaging/
          fi
      - name: Install Playwright (Chromium)
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run test:site
