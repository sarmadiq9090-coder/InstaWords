name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:vba
      - name: Check generated VBA is up to date
        run: git diff --exit-code -- vba/Tafqit.bas vba/TafqitTests.bas
      - name: Install Playwright (Chromium)
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run test:site
