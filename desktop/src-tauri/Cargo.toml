[package]
name = "instawords"
version = "0.0.0" # unused: the app version comes from the repo package.json (tauri.conf.json → "version")
description = "InstaWords (تفقيط) — numbers to words for cheques and invoices, offline"
authors = ["FastKiwi"]
license = "MIT"
repository = "https://github.com/sarmadiq9090-coder/tafket"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "instawords_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
percent-encoding = "2.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
